[project]
name = "x-persona"
version = "0.1.0"
description = "Playwright-based automation utilities for X (Twitter) persona management"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.52",
    "pydantic>=2.11",
]

[project.scripts]
x-login = "utils.browser:cli_login"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["utils"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.0",
]
