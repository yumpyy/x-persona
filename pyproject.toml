[project]
name = "xpersonas"
version = "0.1.0"
description = "xpersonas: autonomous social media persona platform"
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.60.0",
    "pydantic>=2.13.4",
    "langgraph>=0.4.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.3.0",
    "python-dotenv>=1.1.0",
    "pyyaml>=6.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
]

[project.scripts]
xpersonas = "xpersonas.cli.main:app"
xpersonas-api = "xpersonas.api.server:run"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["xpersonas", "xpersonas.*"]

[tool.uv]
package = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_test_loop_scope = "function"
