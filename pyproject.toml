[project]
name = "x-personas"
version = "0.1.0"
description = "X Personas — autonomous social media agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.60.0",
    "pydantic>=2.13.4",
    "langgraph>=0.4.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "python-dotenv>=1.1.0",
]

[project.scripts]
x-personas = "src.agent.runner:main"
generate-persona = "src.generate_persona:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_test_loop_scope = "function"

